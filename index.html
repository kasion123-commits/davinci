<html lang="ko"><head><meta charset="utf-8">

<title>다빈치 코드</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e1d6;--fg:#1d1b18;--card:#f4f1ea;--mut:#6d675c;--acc:#e5522f;--line:#cdc6b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#efeae0;--card:#26241f;--mut:#9b9486;--line:#3a372f;--acc:#ff7352;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1916;--fg:#efeae0;--card:#26241f;--mut:#9b9486;--line:#3a372f;--acc:#ff7352;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 12px 28px}
h1{font:400 32px/1.1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:1px;margin:8px 0 2px}.m{color:var(--mut);margin:2px 0 10px;font-size:13px}
input{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;box-sizing:border-box;margin:6px 0}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);margin:4px 4px 4px 0;cursor:pointer}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--line)}button:disabled{opacity:.35}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.pl.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.pl.out{opacity:.45}.pl>span{font-size:13px;color:var(--mut)}
.hand{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:flex-end}
.t{width:46px;height:64px;border-radius:3px;position:relative;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;user-select:none;transition:transform .15s;font:400 28px/1 "Black Han Sans","Arial Black",system-ui,sans-serif;padding:4px}
.t::before{content:"";position:absolute;inset:4px 3px 3px 4px;border-radius:2px}
.t b{position:relative;z-index:1;display:block;min-width:28px;text-align:center;padding:0 0 3px;border-bottom:2.5px solid currentColor;margin-top:4px}
.t.two{font-size:24px}.t.two b{letter-spacing:-2px}
.t.w{background:linear-gradient(135deg,#fffdf6,#ddd8c7);color:#15151a;border:1px solid #b9b3a1;box-shadow:2px 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px #fff}
.t.w::before{background:linear-gradient(160deg,#e9e5d8,#fbf9f2 45%);box-shadow:inset 2px 2px 3px rgba(0,0,0,.28),inset -1px -1px 1px #fff}
.t.b{background:linear-gradient(135deg,#2a2e3a,#07080c);color:#f4f5f8;border:1px solid #000;box-shadow:2px 3px 0 rgba(0,0,0,.5),inset 0 0 0 1px #3d4252}
.t.b::before{background:linear-gradient(160deg,#0b0c11,#1b1e29 55%);box-shadow:inset 2px 2px 4px rgba(0,0,0,.9),inset -1px -1px 1px rgba(255,255,255,.12)}
.t.hd b{border-color:transparent}
.t.hd::after{content:"";position:absolute;top:7px;left:8px;width:4px;height:4px;border-radius:50%;background:rgba(128,128,128,.7);z-index:1}
.hand{gap:4px;align-items:flex-end}.hand .t{top:0}
.pl .hand{padding:8px 8px 10px;border-radius:8px;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.02));box-shadow:inset 0 2px 5px rgba(0,0,0,.22),inset 0 -1px 0 rgba(255,255,255,.08)}
.pad .t{top:0!important}
.tbl{position:relative;height:270px;margin:10px 0;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 38%,#2f6b5a 0,#1f4d41 58%,#10291f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 8px 28px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.2)}
.tbl::after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.12);border-radius:11px;pointer-events:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tbl{filter:brightness(.85)}}
:root[data-theme="dark"] .tbl{filter:brightness(.85)}
.pt{position:absolute;width:46px;height:32px;border-radius:3px;box-sizing:border-box;box-shadow:1px 2px 3px rgba(0,0,0,.45)}
.pt::before{content:"";position:absolute;inset:3px;border-radius:2px}
.pt::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:14px;margin:-7px 0 0 -8px;background:radial-gradient(circle 1.4px at 8px 2px,var(--d) 95%,transparent),radial-gradient(circle 1.4px at 3px 7px,var(--d) 95%,transparent),radial-gradient(circle 1.4px at 13px 7px,var(--d) 95%,transparent),radial-gradient(circle 1.4px at 8px 12px,var(--d) 95%,transparent)}
.pt.w{background:#f7f5ed;border:1px solid #c5bfae;--d:#aaa595}.pt.w::before{background:#fdfcf8;box-shadow:inset 1px 1px 2px rgba(0,0,0,.2)}
.pt.b{background:#0b0c10;border:1px solid #000;--d:#5b6070}.pt.b::before{background:#1b1d25;box-shadow:inset 1px 1px 3px #000}
.pt.go{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 2px var(--acc),1px 2px 4px rgba(0,0,0,.5)}
.pt.gh{position:fixed!important;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.35) rotate(-8deg)!important;box-shadow:0 10px 20px rgba(0,0,0,.5)!important;cursor:grabbing}
.pl.drop{outline:2px dashed var(--acc);outline-offset:2px;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.t.op{transform:translateY(5px) scale(.93);opacity:.6;box-shadow:none}
.t.mine::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.t.sel{outline:3px solid var(--acc);outline-offset:2px}.t[onclick]{cursor:pointer}
.sl{width:20px;height:58px;padding:0;border-radius:6px;background:var(--acc);color:#fff;margin:0}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.pad .t{width:100%;box-sizing:border-box;cursor:pointer}
.log{font-size:13px;color:var(--mut);margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.big{font:400 21px/1.3 "Black Han Sans","Apple SD Gothic Neo",sans-serif;margin:10px 0}
.t[onclick]:active{transform:translateY(3px)}
body{background:radial-gradient(120% 70% at 50% 0,rgba(128,128,128,.15),transparent 60%),var(--bg)}
.bn{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;margin:0 0 6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.bn.me{background:var(--acc);color:#fff;border-color:var(--acc)}
.bn{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400;letter-spacing:.5px}
.ibx{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:5;transform-origin:50% 100%;pointer-events:none}
.ibx .inn,.ibx .lid{position:absolute;inset:0;border-radius:4px}

/* ---- 가독성 개선 ---- */
html,body{font-size:16px}
#app{max-width:600px;padding:10px 12px 20px}
.m{font-size:14px}
.bn{padding:10px 14px;line-height:1.3}
.bn small{display:block;font:400 14px/1.35 "Gowun Dodum",system-ui,sans-serif;letter-spacing:0;margin-top:3px}
.pl>span{font-size:15px;color:var(--fg);font-weight:700}
.pl>span em{font-style:normal;font-weight:400;color:var(--mut);font-size:13px;margin-left:8px}
.pl>span em.turn{color:var(--acc);font-weight:700}
.t{width:48px;height:68px}
#mh .t{width:54px;height:76px;font-size:31px}
#mh .t.two{font-size:26px}
.t.op{opacity:1;transform:translateY(4px) scale(.92);filter:saturate(.7) brightness(.92);box-shadow:none}
.hand .t[onclick]:not(.sel){outline:2px dashed color-mix(in srgb,var(--acc) 70%,transparent);outline-offset:2px}
.sl{width:28px;height:76px}
.dock{position:sticky;bottom:0;z-index:6;margin:12px -12px 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.16)}
.dock .pad{grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 2px}
.dock .pad .t{height:50px;font-size:24px}
.dock .pad .t.two{font-size:21px}
.dock .row{min-height:68px}

/* ---- 시작 화면 ---- */
.hero{position:relative;margin:4px 0 14px;padding:26px 16px 24px;border-radius:20px;text-align:center;color:#f4efe2;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 30%,#2f6b5a 0,#1f4d41 58%,#10291f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.25)}
.hero::after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.14);border-radius:13px;pointer-events:none}
.hero .tiles{display:flex;justify-content:center;gap:7px}
.hero h1{font-size:46px;margin:20px 0 8px;letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hero p{margin:0;color:rgba(244,239,226,.78);font-size:14px}
.hero .t{animation:flip .7s cubic-bezier(.2,.7,.25,1) backwards;animation-delay:calc(var(--i)*110ms)}
@keyframes flip{from{transform:perspective(400px) rotateY(90deg) translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero .t{animation:none}}
.entry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.entry input{margin:0 0 10px;padding:13px;font-size:16px}
.entry button{width:100%;margin:0;padding:14px;font-size:16px}
.entry .go{background:var(--acc);color:#fff;font:400 19px/1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:1px;padding:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.entry .row{gap:8px}
.entry .row input{margin:0;text-align:center;letter-spacing:6px;font:400 20px "Black Han Sans",ui-monospace,monospace}
.entry .row input::placeholder{letter-spacing:0;font:400 15px "Gowun Dodum",system-ui,sans-serif}
.entry .row button{width:96px;flex:none}
details.dc{margin-top:14px;color:var(--mut);font-size:14px}
details.dc summary{cursor:pointer;padding:6px 2px}
details.dc .row button{flex:1}

/* ---- 대기실 ---- */
.hero.lb{padding:20px 16px 22px}.hero.lb .tiles{margin-top:12px}
.seats{display:grid;gap:8px;margin:0 0 12px}
.seat{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.seat span{flex:1;font-weight:700;font-size:16px}
.seat em{font-style:normal;font-size:13px;color:var(--acc);font-weight:700}
.seat .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fg);color:var(--bg);font:400 18px/1 "Black Han Sans",sans-serif}
.seat.empty{border-style:dashed;background:transparent;color:var(--mut)}
.seat.empty .av{background:transparent;border:1px dashed var(--line);color:var(--mut)}
.seat.empty span{font-weight:400}
.lbb button{flex:1;margin:0;padding:14px}
.lbb button:last-child{background:var(--acc);color:#fff}
.seat .x{width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:transparent;color:var(--mut);border:1px solid var(--line);font-size:15px;flex:none}
.sw{position:relative;border-radius:14px;overflow:hidden}
.sw .seat{position:relative;margin:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease}
.sw.open .seat{transform:translateX(-84px)}
.sw .del{position:absolute;right:0;top:0;bottom:0;width:84px;margin:0;padding:0;border-radius:0;background:#c0392b;color:#fff;font-size:15px}
.hero.lb .t{width:54px;height:76px;font:700 32px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
.hero.lb .t b{min-width:30px}
#cd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;text-transform:uppercase}
#bgm{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(18px,calc((100vw - 600px)/2 + 20px));width:36px;height:36px;padding:0;margin:0;border-radius:50%;background:rgba(20,20,20,.72);color:#fff;font-size:16px;line-height:36px;border:1px solid rgba(255,255,255,.25)}
.bn{padding-right:56px}
.myturn{position:fixed;left:50%;top:38%;z-index:40;padding:14px 30px;border-radius:999px;background:var(--acc);color:#fff;font:400 34px/1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:2px;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;animation:mt 1.5s ease both}
@keyframes mt{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
body.mt::after{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 3px var(--acc),inset 0 0 26px color-mix(in srgb,var(--acc) 45%,transparent)}
.bn.me{animation:bnp 1.8s ease-in-out infinite}
@keyframes bnp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 35%,transparent),0 2px 8px rgba(0,0,0,.15)}}
@media (prefers-reduced-motion:reduce){.bn.me{animation:none}}
#mh .t.op{opacity:1;filter:none;transform:translateY(7px) scale(.94);box-shadow:0 0 0 2px var(--acc)}
#mh .t.op::after{content:"공개";position:absolute;left:50%;top:-9px;transform:translateX(-50%);padding:2px 6px;border-radius:7px;background:var(--acc);color:#fff;font:700 10px/1 "Gowun Dodum",system-ui,sans-serif;letter-spacing:0;white-space:nowrap;z-index:2}

/* ---- 공개된 타일은 위로 올림 ---- */
.pl .hand{padding-top:20px}
.t.op,#mh .t.op{transform:translateY(-10px) scale(.94)}
/* ---- 게임 방법 안내 ---- */
ol.gd{margin:6px 0 4px;padding-left:20px;font-size:14px;line-height:1.55;color:var(--fg)}
ol.gd li{margin:5px 0}
ol.gd b{color:var(--acc)}
details.dc[open]{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px}
/* ---- 카톡 버튼 ---- */
button.kk{background:#fee500;color:#191919;border-color:#e6cf00;font-weight:700}
.lbb button.kk:last-child{background:#fee500;color:#191919}
.lnk{margin:12px 0 0;gap:8px}.lnk button{flex:1;margin:0}
#cbtn{display:none;position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(max(18px,calc((100vw - 600px)/2 + 20px)) + 46px);width:36px;height:36px;padding:0;margin:0;border-radius:50%;align-items:center;justify-content:center;font-size:17px;background:var(--card);color:var(--fg);border:1px solid var(--line)}

/* ---------- 새로고침 · 앱 재실행 시 같은 방으로 자동 복귀 ----------
   폰이 백그라운드의 페이지를 정리해도, 다시 열면 방 코드와 내 ID(방장은 게임 상태까지)를 복원해 이어서 합니다. */
const SESS_KEY='dv_sess',SESS_TTL=3*3600*1000;
function saveSess(){
  try{
    if(leaving||!code||code==='직접'||conn)return;
    if(!isHost&&!C)return;
    const o={id:me.id,name:me.name,code,host:isHost?1:0,ts:Date.now()};
    if(isHost&&S)o.S=S;
    localStorage.setItem(SESS_KEY,JSON.stringify(o));
  }catch(_){}
}
function clearSess(){try{localStorage.removeItem(SESS_KEY)}catch(_){}}
function readSess(){
  try{
    const o=JSON.parse(localStorage.getItem(SESS_KEY)||'null');
    if(!o||!o.id||Date.now()-o.ts>SESS_TTL||!/^[a-z0-9]{4}$/.test(o.code||''))return null;
    return o;
  }catch(_){return null}
}
async function resumeSession(){
  const o=readSess();if(!o)return;
  if(LINK_R&&LINK_R!==o.code){clearSess();return}   // 다른 방 초대 링크로 열었으면 그쪽이 우선
  if(o.host&&(!o.S||!Array.isArray(o.S.P))){clearSess();return}
  me.id=String(o.id);me.name=o.name||me.name;code=o.code;leaving=0;
  joining=true;render();
  if(o.host){
    S=o.S;isHost=true;
    try{rm=RM?await RM.join('dv-'+code):await mqRoom(code,'h');rm.on('act',m=>act(m.data))}
    catch(e){cleanup();clearSess();render();alert('이전 방에 다시 연결하지 못했어요.');return}
    joining=false;clearInterval(bcT);bcT=setInterval(bc,5000);bc();sched();render();
  }else{
    try{rm=RM?await RM.join('dv-'+code):await mqRoom(code,'g');rm.on('st',m=>recv(m.data))}
    catch(e){cleanup();clearSess();render();alert('이전 방에 다시 연결하지 못했어요.');return}
    const ping=setInterval(()=>{if(C||!joining)return clearInterval(ping);send({t:'join',name:me.name})},1500);send({t:'join',name:me.name});
    setTimeout(()=>{if(!C&&joining){cleanup();clearSess();render();alert('이전 방에서 응답이 없어요. 방이 닫혔을 수 있어요.')}},15000);
  }
}

  document.addEventListener('pointerup',un,{once:true})})();

/* ---------- 패배 빗줄기 ---------- */
function stopRain(){const o=document.getElementById('rnw');if(o)o.remove()}
function rain(){
  
  stopRain();loseSfx();
  const w=document.createElement('div');w.id='rnw';w.setAttribute('aria-hidden','true');
  w.style.cssText='position:fixed;inset:0;z-index:60;pointer-events:none;background:linear-gradient(#0a1426,#1b2740);opacity:0;transition:opacity 1.2s';
  const cv=document.createElement('canvas');cv.style.cssText='position:absolute;inset:0;width:100%;height:100%';
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  w.appendChild(cv);document.body.appendChild(w);requestAnimationFrame(()=>{w.style.opacity='.5'});
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const N=W<500?110:180,D=[],R=[];
  const mk=(init)=>({x:Math.random()*(W+120)-60,y:init?Math.random()*H:-20-Math.random()*H*.3,l:10+Math.random()*16,v:700+Math.random()*500,a:.25+Math.random()*.4});
  for(let i=0;i<N;i++)D.push(mk(1));
  let last=0,t0=0;
  function frame(ts){
    if(!document.getElementById('rnw'))return;
    if(!t0)t0=ts;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;const el=ts-t0;
    g.clearRect(0,0,W,H);g.lineWidth=1.3;g.lineCap='round';
    for(const d of D){d.y+=d.v*dt;d.x-=d.v*dt*.18;
      if(d.y>H){if(el<6000&&Math.random()<.35)R.push({x:d.x,y:H-4-Math.random()*10,r:1,a:.5});if(el<6000)Object.assign(d,mk(0));else d.y=-999}
      g.strokeStyle=`rgba(190,215,255,${d.a})`;g.beginPath();g.moveTo(d.x,d.y);g.lineTo(d.x+d.l*.18,d.y-d.l);g.stroke()}
    for(let i=R.length-1;i>=0;i--){const r=R[i];r.r+=40*dt;r.a-=1.4*dt;if(r.a<=0){R.splice(i,1);continue}
      g.strokeStyle=`rgba(190,215,255,${r.a})`;g.beginPath();g.ellipse(r.x,r.y,r.r,r.r*.35,0,0,7);g.stroke()}
    if(el>6000&&w.style.opacity!=='0')w.style.opacity='0';
    if(el>7400){stopRain();return}
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  setTimeout(stopRain,9000);
}

/* ---------- 승리 폭죽 ---------- */
function fireworks(){
  
  const old=document.getElementById('fwc');if(old)old.remove();
  const cv=document.createElement('canvas');cv.id='fwc';cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none';
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const COL=['#ff7352','#f5c542','#ffffff','#7be0b0','#6fb7ff','#ff8fc8'];
  const rockets=[],sparks=[];let launched=0,last=0,t0=0;const TOTAL=7;
  const launch=()=>{rockets.push({x:W*(.15+Math.random()*.7),y:H+10,ty:H*(.15+Math.random()*.35),vy:-(H*.9+Math.random()*H*.25),c:COL[Math.floor(Math.random()*COL.length)]})};
  const burst=(x,y,c)=>{const n=46+Math.floor(Math.random()*24),two=Math.random()<.4,c2=COL[Math.floor(Math.random()*COL.length)];
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.15,s=(.6+Math.random()*.5)*(W<500?150:200);
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:.55+Math.random()*.4,c:two&&i%2?c2:c})}};
  function frame(ts){
    if(!t0)t0=ts;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
    g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,0,W,H);   // 꼬리 효과
    g.globalCompositeOperation='lighter';
    if(launched<TOTAL&&ts-t0>launched*480){launch();launched++}
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;r.vy*=.985;
      g.fillStyle=r.c;g.beginPath();g.arc(r.x,r.y,2.2,0,7);g.fill();
      if(r.y<=r.ty||Math.abs(r.vy)<60){burst(r.x,r.y,r.c);rockets.splice(i,1)}}
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.vx*=.985;s.vy=s.vy*.985+120*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=s.d*dt;
      if(s.life<=0){sparks.splice(i,1);continue}
      g.globalAlpha=Math.max(0,s.life);g.fillStyle=s.c;g.beginPath();g.arc(s.x,s.y,1.8+s.life,0,7);g.fill()}
    g.globalAlpha=1;
    if(launched<TOTAL||rockets.length||sparks.length)requestAnimationFrame(frame);else cv.remove()}
  requestAnimationFrame(frame);
  setTimeout(()=>{try{cv.remove()}catch(_){}},9000);   // 안전장치
}

async function ensureProfile(u){
  let {data,error}=await sb.from('profiles').select('id,nickname,friend_code,xp').eq('id',u.id).maybeSingle();
  if(error)throw error;
  if(!data){ // DB 트리거가 만들어 두지만, 혹시 없으면 직접 생성
    const nick=String(u.user_metadata?.full_name||u.user_metadata?.name||u.email?.split('@')[0]||'플레이어').slice(0,20)||'플레이어';
    for(let i=0;i<5&&!data;i++){
      const r=await sb.from('profiles').insert({id:u.id,nickname:nick,friend_code:makeFriendCode()}).select('id,nickname,friend_code,xp').single();
      if(!r.error)data=r.data;
      else if(r.error.code==='23505'){const g=await sb.from('profiles').select('id,nickname,friend_code,xp').eq('id',u.id).maybeSingle();if(g.data)data=g.data} // 코드 충돌이면 재시도, 이미 생겼으면 사용
      else throw r.error;
    }
    if(!data)throw new Error('프로필을 만들지 못했어요.');
  }
  sbProfile=data;
  return data;
}

/* 계정 패널은 비동기로 그려서 문자열(accountMarkup)로 보관 → home()이 동기적으로 가져다 씀 */
async function buildAccountMarkup(){
  if(!sb)return '';
  const box=c=>`<section class="pl" style="padding:14px;margin:10px 0">${c}</section>`;
  if(!sbUser)return box(`<b>🌐 온라인 계정</b><p class="m">구글 계정으로 로그인하면 친구 코드·친구 목록·레벨이 기기 간에 동기화돼요. 로그인 없이도 게임은 그대로 할 수 있어요.</p><button onclick="googleLogin()">Google로 로그인</button>`);
  let incoming=[],friends=[],outgoing=[],failed=false;
  try{
    const [a,b,c]=await Promise.all([
      sb.from('friend_requests').select('id,sender_id').eq('receiver_id',sbUser.id).eq('status','pending'),
      sb.from('friend_requests').select('id,sender_id,receiver_id').or(`sender_id.eq.${sbUser.id},receiver_id.eq.${sbUser.id}`).eq('status','accepted'),
      sb.from('friend_requests').select('id,receiver_id').eq('sender_id',sbUser.id).eq('status','pending')
    ]);
    const er=a.error||b.error||c.error;if(er)throw er;
    const ids=[...new Set([...(a.data||[]).map(x=>x.sender_id),...(b.data||[]).map(x=>x.sender_id===sbUser.id?x.receiver_id:x.sender_id),...(c.data||[]).map(x=>x.receiver_id)])];
    const map={};
    if(ids.length){const r=await sb.from('profiles').select('id,nickname,friend_code,xp').in('id',ids);if(r.error)throw r.error;(r.data||[]).forEach(x=>map[x.id]=x)}
    incoming=(a.data||[]).map(x=>({...x,p:map[x.sender_id]}));
    friends=(b.data||[]).map(x=>({...x,p:map[x.sender_id===sbUser.id?x.receiver_id:x.sender_id]}));
    outgoing=(c.data||[]).map(x=>({...x,p:map[x.receiver_id]}));
  }catch(e){failed=true;console.warn('친구 목록 조회 실패',e)}
  const xp=Number(sbProfile?.xp)||0,lv=xpLevel(xp),pc=xpRemain(xp),code=esc(sbProfile?.friend_code||'');
  const nm=p=>esc(p?.nickname||'사용자');
  return box(`<div class="row" style="justify-content:space-between"><b>👤 ${esc(sbProfile?.nickname||sbUser.email||'내 계정')}</b><button class="s" onclick="socialLogout()">로그아웃</button></div>
  <div style="font:400 24px 'Black Han Sans';margin:8px 0 2px">LEVEL ${lv}</div><div style="height:9px;background:var(--line);border-radius:9px;overflow:hidden"><div style="height:100%;width:${pc}%;background:var(--acc)"></div></div><p class="m">경험치 ${xp} XP · 다음 레벨까지 ${100-pc} XP <br>게임을 끝까지 하면 +20, 이기면 +100 XP</p>
  <div class="row"><span class="m" style="margin:0">내 친구 코드</span><b style="letter-spacing:1px">${code}</b><button class="s" onclick="cpt('${code}').then(x=>alert(x?'친구 코드를 복사했어요.':'복사하지 못했어요.'))">복사</button></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><b>친구 추가</b>
  <div class="row"><input id="friendSearch" placeholder="친구 코드 8자리" maxlength="8" autocomplete="off" style="margin:6px 0"><button onclick="findFriend()">검색</button></div><div id="friendResult" class="m"></div>
  ${failed?'<p class="m">친구 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>':''}
  ${incoming.length?`<p><b>받은 요청 (${incoming.length})</b></p>${incoming.map(x=>`<div class="row" style="justify-content:space-between"><span>${nm(x.p)}</span><span><button onclick="acceptFriendRequest('${x.id}')">수락</button> <button class="s" onclick="rejectFriendRequest('${x.id}')">거절</button></span></div>`).join('')}`:''}
  ${outgoing.length?`<p><b>보낸 요청 (${outgoing.length})</b></p>${outgoing.map(x=>`<p class="m">${nm(x.p)} · 대기 중</p>`).join('')}`:''}
  <p><b>친구 목록 (${friends.length})</b></p>${friends.length?friends.map(x=>`<div class="row" style="justify-content:space-between"><span>${nm(x.p)} <small class="m">LV ${xpLevel(x.p?.xp)}</small></span><button class="s" onclick="removeFriendRequest('${x.id}')">삭제</button></div>`).join(''):'<p class="m">아직 친구가 없어요. 친구 코드로 추가해 보세요.</p>'}`);
}
async function updateAccount(){
  if(!sb)return;
  let m='';try{m=await buildAccountMarkup()}catch(e){console.warn(e);m=''}
  if(sbProfile&&!me.name)me.name=String(sbProfile.nickname||'').slice(0,10);
  if(m===accountSig)return; // 바뀐 게 없으면 다시 그리지 않음(입력 중 내용 보존)
  accountSig=m;accountMarkup=m;
  if(!C&&!conn&&!joining&&!document.activeElement?.matches?.('input,textarea'))render();
}

async function syncAuth(){
  if(!sb)return;
  try{const {data}=await sb.auth.getSession();sbUser=data.session?.user||null;
    if(sbUser)await ensureProfile(sbUser);else sbProfile=null}
  catch(e){console.warn('계정 정보를 불러오지 못했어요.',e)}
  await updateAccount();
}
async function googleLogin(){
  if(!sb)return;
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error)alert('구글 로그인에 실패했어요: '+error.message);
}
async function socialLogout(){
  if(!sb)return;
  const {error}=await sb.auth.signOut();if(error)alert(error.message);
  sbUser=null;sbProfile=null;lastRewardKey='';await updateAccount();
}
async function refreshSocial(){if(!sbUser)return;try{await ensureProfile(sbUser)}catch(e){console.warn(e)}accountSig='';await updateAccount();render()}

/* 친구: 코드로 정확히 일치하는 1명만 조회(RPC) — 전체 사용자 목록은 노출되지 않음 */
async function findFriend(){
  if(!sbUser)return alert('먼저 구글 로그인을 해주세요.');
  const v=($('#friendSearch')?.value||'').trim().toUpperCase();if(!v)return alert('친구 코드를 입력해 주세요.');
  const out=$('#friendResult');if(out)out.textContent='검색 중…';
  const {data,error}=await sb.rpc('find_profile_by_code',{p_code:v});
  if(error){if(out)out.textContent='검색 오류: '+error.message;return}
  const p=Array.isArray(data)?data[0]:data;
  if(!p){if(out)out.textContent='해당 친구 코드를 찾을 수 없어요.';return}
  if(p.id===sbUser.id){if(out)out.textContent='내 친구 코드예요.';return}
  const {data:old}=await sb.from('friend_requests').select('id,status').or(`and(sender_id.eq.${sbUser.id},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${sbUser.id})`).limit(1);
  if(old?.length){if(out)out.textContent=old[0].status==='accepted'?'이미 친구예요.':'이미 친구 요청이 있어요.';return}
  if(out)out.innerHTML=`<b>${esc(p.nickname)}</b> · LV ${xpLevel(p.xp)} <button onclick="sendFriendRequest('${p.id}')">친구 요청</button>`;
}
async function sendFriendRequest(id){
  const {error}=await sb.from('friend_requests').insert({sender_id:sbUser.id,receiver_id:id,status:'pending'});
  if(error){alert(error.code==='23505'?'이미 요청을 보냈거나 받은 상태예요.':error.message);return}
  alert('친구 요청을 보냈어요!');await refreshSocial();
}
async function acceptFriendRequest(id){
  const {error}=await sb.from('friend_requests').update({status:'accepted'}).eq('id',id).eq('receiver_id',sbUser.id);
  if(error){alert('수락하지 못했어요: '+error.message);return}await refreshSocial();
}
async function rejectFriendRequest(id){
  const {error}=await sb.from('friend_requests').delete().eq('id',id).eq('receiver_id',sbUser.id);
  if(error){alert(error.message);return}await refreshSocial();
}
async function removeFriendRequest(id){
  if(!confirm('친구 관계를 삭제할까요?'))return;
  const {error}=await sb.from('friend_requests').delete().eq('id',id).or(`sender_id.eq.${sbUser.id},receiver_id.eq.${sbUser.id}`);
  if(error){alert(error.message);return}await refreshSocial();
}

/* 게임이 끝나면 경험치: 참가 +20, 승리 +100. 같은 게임은 DB(xp_awards 기본키)가 중복 지급을 막음 */
async function rewardFinishedGame(){
  if(!sb||!sbUser||!C?.s||C.s.ph!=='over'||!C.s.gid)return;
  const k=C.s.gid+':'+sbUser.id;if(k===lastRewardKey)return;lastRewardKey=k;
  const amount=C.s.win===me.id?100:20;
  try{
    const {data,error}=await sb.rpc('award_game_xp',{p_game_id:C.s.gid,p_amount:amount});if(error)throw error;
    if(data!=null)sbProfile={...sbProfile,xp:Number(data)};else await ensureProfile(sbUser);
    accountSig='';await updateAccount();
  }catch(e){console.warn('경험치 지급 실패',e);lastRewardKey=''}
}
{const _render=render;render=function(){_render();if(C?.s?.ph==='over')rewardFinishedGame()}}

if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    sbUser=session?.user||null;
    setTimeout(async()=>{ // 콜백 안에서 바로 supabase 를 호출하면 교착될 수 있어 한 틱 미룸
      try{if(sbUser)await ensureProfile(sbUser);else sbProfile=null}catch(e){console.warn(e)}
      await updateAccount();
    },0);
  });
  syncAuth();
}

</script></body></html>
