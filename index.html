<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다빈치 코드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e1d6;--fg:#1d1b18;--card:#f4f1ea;--mut:#6d675c;--acc:#b8372a;--line:#cdc6b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#efeae0;--card:#26241f;--mut:#9b9486;--line:#3a372f;--acc:#e0604f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1916;--fg:#efeae0;--card:#26241f;--mut:#9b9486;--line:#3a372f;--acc:#e0604f;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 12px 28px}
h1{font:400 32px/1.1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:1px;margin:8px 0 2px}.m{color:var(--mut);margin:2px 0 10px;font-size:13px}
input{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;box-sizing:border-box;margin:6px 0}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);margin:4px 4px 4px 0;cursor:pointer}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--line)}button:disabled{opacity:.35}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.code{font:400 36px/1 "Black Han Sans",ui-monospace,monospace;letter-spacing:6px;background:var(--card);border-radius:12px;padding:14px;text-align:center;margin:6px 0 12px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.pl.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.pl.out{opacity:.45}.pl>span{font-size:13px;color:var(--mut)}
.hand{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:flex-end}
.t{width:46px;height:64px;border-radius:3px;position:relative;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;user-select:none;transition:transform .15s;font:400 28px/1 "Black Han Sans","Arial Black",system-ui,sans-serif;padding:4px}
.t::before{content:"";position:absolute;inset:4px 3px 3px 4px;border-radius:2px}
.t b{position:relative;z-index:1;display:block;min-width:28px;text-align:center;padding:0 0 3px;border-bottom:2.5px solid currentColor;margin-top:4px}
.t.two{font-size:24px}.t.two b{letter-spacing:-2px}
.t.w{background:linear-gradient(135deg,#fffdf6,#ddd8c7);color:#15151a;border:1px solid #b9b3a1;box-shadow:2px 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px #fff}
.t.w::before{background:linear-gradient(160deg,#e9e5d8,#fbf9f2 45%);box-shadow:inset 2px 2px 3px rgba(0,0,0,.28),inset -1px -1px 1px #fff}
.t.b{background:linear-gradient(135deg,#2a2e3a,#07080c);color:#f4f5f8;border:1px solid #000;box-shadow:2px 3px 0 rgba(0,0,0,.5),inset 0 0 0 1px #3d4252}
.t.b::before{background:linear-gradient(160deg,#0b0c11,#1b1e29 55%);box-shadow:inset 2px 2px 4px rgba(0,0,0,.9),inset -1px -1px 1px rgba(255,255,255,.12)}
.t.hd b{border-color:transparent}
.t.hd::after{content:"";position:absolute;top:7px;left:8px;width:4px;height:4px;border-radius:50%;background:rgba(128,128,128,.7);z-index:1}
.hand{gap:4px;align-items:flex-end}.hand .t{top:0}
.pl .hand{padding:8px 8px 10px;border-radius:8px;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.02));box-shadow:inset 0 2px 5px rgba(0,0,0,.22),inset 0 -1px 0 rgba(255,255,255,.08)}
.pad .t{top:0!important}
.tbl{position:relative;height:270px;margin:10px 0;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 38%,#2f6b5a 0,#1f4d41 58%,#10291f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 8px 28px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.2)}
.tbl::after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.12);border-radius:11px;pointer-events:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tbl{filter:brightness(.85)}}
:root[data-theme="dark"] .tbl{filter:brightness(.85)}
.pt{position:absolute;width:46px;height:32px;border-radius:3px;box-sizing:border-box;box-shadow:1px 2px 3px rgba(0,0,0,.45)}
.pt::before{content:"";position:absolute;inset:3px;border-radius:2px}
.pt::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:14px;margin:-7px 0 0 -8px;background:radial-gradient(circle 1.4px at 8px 2px,var(--d) 95%,transparent),radial-gradient(circle 1.4px at 3px 7px,var(--d) 95%,transparent),radial-gradient(circle 1.4px at 13px 7px,var(--d) 95%,transparent),radial-gradient(circle 1.4px at 8px 12px,var(--d) 95%,transparent)}
.pt.w{background:#f7f5ed;border:1px solid #c5bfae;--d:#aaa595}.pt.w::before{background:#fdfcf8;box-shadow:inset 1px 1px 2px rgba(0,0,0,.2)}
.pt.b{background:#0b0c10;border:1px solid #000;--d:#5b6070}.pt.b::before{background:#1b1d25;box-shadow:inset 1px 1px 3px #000}
.pt.go{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 2px var(--acc),1px 2px 4px rgba(0,0,0,.5)}
.pt.gh{position:fixed!important;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.35) rotate(-8deg)!important;box-shadow:0 10px 20px rgba(0,0,0,.5)!important;cursor:grabbing}
.pl.drop{outline:2px dashed var(--acc);outline-offset:2px;background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.tbl.sm{height:130px}.tbl.sm .pt{width:30px;height:21px}.tbl.sm .pt::before{inset:2px}.tbl.sm .pt::after{display:none}
.t.op{transform:translateY(5px) scale(.93);opacity:.6;box-shadow:none}
.t.mine::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.t.sel{outline:3px solid var(--acc);outline-offset:2px}.t[onclick]{cursor:pointer}
.sl{width:20px;height:58px;padding:0;border-radius:6px;background:var(--acc);color:#fff;margin:0}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.pad .t{width:100%;box-sizing:border-box;cursor:pointer}
.pile{display:inline-flex;gap:6px;border:1px solid #888;padding:12px 18px}
.pile.b{background:#14151a;color:#fff}.pile.w{background:#f4f2ec;color:#111}
.log{font-size:13px;color:var(--mut);margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.big{font:400 21px/1.3 "Black Han Sans","Apple SD Gothic Neo",sans-serif;margin:10px 0}
.t.dis{opacity:.18;pointer-events:none}.t[onclick]:active{transform:translateY(3px)}
body{background:radial-gradient(120% 70% at 50% 0,rgba(128,128,128,.15),transparent 60%),var(--bg)}
.bn{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;margin:0 0 6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.bn.me{background:var(--acc);color:#fff;border-color:var(--acc)}
textarea{width:100%;box-sizing:border-box;height:90px;font:12px ui-monospace,monospace;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;word-break:break-all;margin:4px 0}
.bn{font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-weight:400;letter-spacing:.5px}
.ibx{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;z-index:5;transform-origin:50% 100%;pointer-events:none}
.ibx .inn,.ibx .lid{position:absolute;inset:0;border-radius:4px}

/* ---- 가독성 개선 ---- */
html,body{font-size:16px}
#app{max-width:600px;padding:10px 12px 20px}
.m{font-size:14px}
.bn{padding:10px 14px;line-height:1.3}
.bn small{display:block;font:400 14px/1.35 "Gowun Dodum",system-ui,sans-serif;letter-spacing:0;margin-top:3px}
.pl>span{font-size:15px;color:var(--fg);font-weight:700}
.pl>span em{font-style:normal;font-weight:400;color:var(--mut);font-size:13px;margin-left:8px}
.pl>span em.turn{color:var(--acc);font-weight:700}
.t{width:48px;height:68px}
#mh .t{width:54px;height:76px;font-size:31px}
#mh .t.two{font-size:26px}
.t.op{opacity:1;transform:translateY(4px) scale(.92);filter:saturate(.7) brightness(.92);box-shadow:none}
.hand .t[onclick]:not(.sel){outline:2px dashed color-mix(in srgb,var(--acc) 70%,transparent);outline-offset:2px}
.sl{width:28px;height:76px}
.tbl.sm{display:none}
.dock{position:sticky;bottom:0;z-index:6;margin:12px -12px 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.16)}
.dock .pad{grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 2px}
.dock .pad .t{height:50px;font-size:24px}
.dock .pad .t.two{font-size:21px}
.dock .row{min-height:68px}

/* ---- 시작 화면 ---- */
.hero{position:relative;margin:4px 0 14px;padding:26px 16px 24px;border-radius:20px;text-align:center;color:#f4efe2;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 30%,#2f6b5a 0,#1f4d41 58%,#10291f 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.25)}
.hero::after{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.14);border-radius:13px;pointer-events:none}
.hero .tiles{display:flex;justify-content:center;gap:7px}
.hero h1{font-size:46px;margin:20px 0 8px;letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hero p{margin:0;color:rgba(244,239,226,.78);font-size:14px}
.hero .t{animation:flip .7s cubic-bezier(.2,.7,.25,1) backwards;animation-delay:calc(var(--i)*110ms)}
@keyframes flip{from{transform:perspective(400px) rotateY(90deg) translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero .t{animation:none}}
.entry{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.entry input{margin:0 0 10px;padding:13px;font-size:16px}
.entry button{width:100%;margin:0;padding:14px;font-size:16px}
.entry .go{background:var(--acc);color:#fff;font:400 19px/1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:1px;padding:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.entry .row{gap:8px}
.entry .row input{margin:0;text-align:center;letter-spacing:6px;font:400 20px "Black Han Sans",ui-monospace,monospace}
.entry .row input::placeholder{letter-spacing:0;font:400 15px "Gowun Dodum",system-ui,sans-serif}
.entry .row button{width:96px;flex:none}
details.dc{margin-top:14px;color:var(--mut);font-size:14px}
details.dc summary{cursor:pointer;padding:6px 2px}
details.dc .row button{flex:1}

/* ---- 대기실 ---- */
.hero.lb{padding:20px 16px 22px}.hero.lb .tiles{margin-top:12px}
.seats{display:grid;gap:8px;margin:0 0 12px}
.seat{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.seat span{flex:1;font-weight:700;font-size:16px}
.seat em{font-style:normal;font-size:13px;color:var(--acc);font-weight:700}
.seat .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fg);color:var(--bg);font:400 18px/1 "Black Han Sans",sans-serif}
.seat.empty{border-style:dashed;background:transparent;color:var(--mut)}
.seat.empty .av{background:transparent;border:1px dashed var(--line);color:var(--mut)}
.seat.empty span{font-weight:400}
.lbb button{flex:1;margin:0;padding:14px}
.lbb button:last-child{background:var(--acc);color:#fff}
.seat .x{width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:transparent;color:var(--mut);border:1px solid var(--line);font-size:15px;flex:none}
.sw{position:relative;border-radius:14px;overflow:hidden}
.sw .seat{position:relative;margin:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease}
.sw.open .seat{transform:translateX(-84px)}
.sw .del{position:absolute;right:0;top:0;bottom:0;width:84px;margin:0;padding:0;border-radius:0;background:#c0392b;color:#fff;font-size:15px}
.rcard{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;margin:4px 0 12px}
.rcard span{display:block;font-size:13px;color:var(--mut)}
.rcard b{display:block;font:400 44px/1.2 "Black Han Sans",ui-monospace,monospace;letter-spacing:10px;padding-left:10px;margin:4px 0 6px}
.rcard small{font-size:13px;color:var(--mut)}
.hero.lb .t{width:54px;height:76px;font:700 32px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
.hero.lb .t b{min-width:30px}
#cd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;text-transform:uppercase}
#bgm{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(18px,calc((100vw - 600px)/2 + 20px));width:36px;height:36px;padding:0;margin:0;border-radius:50%;background:rgba(20,20,20,.72);color:#fff;font-size:16px;line-height:36px;border:1px solid rgba(255,255,255,.25)}
.bn{padding-right:56px}
.myturn{position:fixed;left:50%;top:38%;z-index:40;padding:14px 30px;border-radius:999px;background:var(--acc);color:#fff;font:400 34px/1 "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:2px;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;animation:mt 1.5s ease both}
@keyframes mt{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
body.mt::after{content:"";position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 3px var(--acc),inset 0 0 26px color-mix(in srgb,var(--acc) 45%,transparent)}
.bn.me{animation:bnp 1.8s ease-in-out infinite}
@keyframes bnp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 35%,transparent),0 2px 8px rgba(0,0,0,.15)}}
@media (prefers-reduced-motion:reduce){.bn.me{animation:none}}
#mh .t.op{opacity:1;filter:none;transform:translateY(7px) scale(.94);box-shadow:0 0 0 2px var(--acc)}
#mh .t.op::after{content:"공개";position:absolute;left:50%;top:-9px;transform:translateX(-50%);padding:2px 6px;border-radius:7px;background:var(--acc);color:#fff;font:700 10px/1 "Gowun Dodum",system-ui,sans-serif;letter-spacing:0;white-space:nowrap;z-index:2}

/* ---- 공개된 타일은 위로 올림 ---- */
.pl .hand{padding-top:20px}
.t.op,#mh .t.op{transform:translateY(-10px) scale(.94)}

ol.gd{margin:6px 0 4px;padding-left:20px;font-size:14px;line-height:1.55;color:var(--fg)}
ol.gd li{margin:5px 0}

details.dc[open]{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px}

.lbb button.kk:last-child{background:#fee500;color:#191919}
.lnk{margin:12px 0 0;gap:8px}.lnk button{flex:1;margin:0}

const LINK_R=(()=>{try{const r=(new URLSearchParams(location.search).get('r')||'').toLowerCase();return /^[a-z0-9]{4}$/.test(r)?r:''}catch(e){return ''}})();

  skipIntro=end;T.push(setTimeout(end,2000+ps.length*45+1200))}
function syncSl(){for(const c of 'bw'){const n=C.s.dk[c],a=SL[c];if(n>a.length){SL[c]=[...Array(n).keys()];continue}while(a.length>n){const k=a.indexOf(lt[c]);a.splice(k>=0?k:a.length-1,1);lt[c]=undefined}}}
(async()=>{try{RM=await window.claude.use('room')}catch(e){RM=null}render()})();

/* ---------- host engine ---------- */
const avail=()=>['b','w'].filter(c=>S.dk[c].length);
const lg=m=>{S.log.push(m);if(S.log.length>6)S.log.shift()};
function ins(h,t,pos){if(t.v==='J')h.splice(pos,0,t);else{let j=-1;h.forEach((x,i)=>{if(x.v!=='J'&&key(x)<key(t))j=i});h.splice(j+1,0,t)}}
function turn0(){S.dr=null;S.g=0;S.pl=0;S.ph=avail().length?'draw':'guess'}
function dInit(p,c){if(S.ph!=='setup'||p.h.length>=S.N||!S.dk[c]||!S.dk[c].length)return;const t=S.dk[c].pop();t.o=0;ins(p.h,t,Math.floor(R()*(p.h.length+1)));if(S.P.every(q=>q.h.length>=S.N)){S.t=0;lg('게임 시작!');turn0()}}
function chk(q){if(!q.out&&q.h.every(t=>t.o)){q.out=1;lg(q.name+' 탈락');const al=S.P.filter(p=>!p.out);if(al.length<2){S.ph='over';S.win=al[0].id}}}
function nxt(){if(S.ph==='over')return;do S.t=(S.t+1)%S.P.length;while(S.P[S.t].out);turn0()}
function fin(){const c=S.P[S.t];if(!S.dr)return nxt();if(S.dr.v==='J'){S.ph='place';return}S.dr.o=S.pl;ins(c.h,S.dr,0);S.dr=null;chk(c);nxt()}
function act(a){
  if(!S||!a)return;const p=S.P.find(x=>x.id===a.pid),c=S.P[S.t],host=S.P[0];
  if(a.t==='join'){if(S.ph==='lobby'&&!p&&S.P.length<4&&a.pid)S.P.push({id:String(a.pid).slice(0,12),name:String(a.name||'손님').slice(0,10),h:[],out:0})}
  else if(!p)return;
  else if(a.t==='bot'&&S.ph==='lobby'&&p===host&&S.P.length<4){const n=S.P.filter(x=>x.bot).length;S.P.push({id:'ai'+S.P.length+Math.floor(R()*1e4),name:'AI '+['민','서','준'][n%3],bot:1,h:[],out:0})}
  else if(a.t==='start'&&S.ph==='lobby'&&p===host&&S.P.length>1){
    S.N=S.P.length>3?3:4;const d={b:[],w:[]};
    for(const k of 'bw'){for(let v=0;v<12;v++)d[k].push({c:k,v,o:0});d[k].push({c:k,v:'J',o:0});sh(d[k])}
    S.dk=d;S.ph='setup';S.log=[];S.win=null;S.P.forEach(x=>{x.h=[];x.out=0});
    S.P.filter(x=>x.bot).forEach(b=>{for(let n=0;n<S.N;n++){const av=avail();dInit(b,av[Math.floor(R()*av.length)])}})}
  else if(a.t==='kick'&&S.ph==='lobby'&&p===host){const q=S.P.find(x=>x.id===a.id);if(!q||q===host)return;S.P=S.P.filter(x=>x!==q);if(!q.bot&&rm)Promise.resolve(rm.emit('st',{to:q.id,kick:1})).catch(()=>{})}

  else if(a.t==='guess'&&S.ph==='guess'&&p===c){

    if(t.v===a.v){t.o=1;S.g=1;lg(`${c.name}→${q.name} ${vs(a.v)} 적중!`);chk(q)}
    else{lg(`${c.name}→${q.name} ${vs(a.v)} 오답`);if(S.dr){S.pl=1;fin()}else S.ph='pen'}}
  else if(a.t==='stop'&&S.ph==='guess'&&p===c&&S.g){S.pl=0;fin()}

  else if(a.t==='pen'&&S.ph==='pen'&&p===c){const t=c.h[a.k];if(!t||t.o)return;t.o=1;chk(c);nxt()}
  else if(a.t==='again'&&S.ph==='over'&&p===host){S.ph='lobby';S.log=[];S.win=null;S.P.forEach(x=>{x.h=[];x.out=0})}

function bc(){
  if(!isHost||!S)return;
  const pub={ph:S.ph,t:S.t,dc:S.dr?S.dr.c:null,g:S.g,N:S.N,log:S.log,win:S.win,dk:{b:S.dk.b.length,w:S.dk.w.length},
    P:S.P.map(p=>({id:p.id,n:p.name,bot:p.bot,out:p.out,h:p.h.map(t=>t.o?[t.c,t.v,1]:[t.c])}))};

    const m={to:p.id,s:pub,me:p.h.map(t=>[t.c,t.v,t.o]),dr:(S.P[S.t]===p&&S.dr)?[S.dr.c,S.dr.v]:null};

function sched(){
  if(!isHost||botT||!S)return;const c=S.P[S.t];

function bot(){
  const b=S.P[S.t];if(!b||!b.bot)return;const id=b.id;

  if(S.ph==='pen')return act({t:'pen',pid:id,k:b.h.findIndex(t=>!t.o)});

const genCode=()=>Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');

async function mqRoom(cd,role){
  await loadMq();

    await new Promise((ok,no)=>{

let ERR=null;
async function mk(){

const kkRoom=()=>{const u=!RM&&inviteUrl();kk(u?'다빈치 코드 같이 해요! 링크를 누르면 방 코드가 자동으로 입력돼요.\n'+u:'다빈치 코드 같이 해요! 방 코드: '+code.toUpperCase())};
const cpRoom=async()=>{const u=!RM&&inviteUrl();alert(await cpt(u||code.toUpperCase())?(u?'초대 링크를 복사했어요.':'방 코드를 복사했어요.'):'복사하지 못했어요.')};
function cpanel(){const c=conn,cp='<div class="row"><button class="s" onclick="cpy()">복사</button><button class="s kk" onclick="kkOut()">공유하기 (카톡 등)</button></div>',bk='<button class="s" onclick="conn=null;isHost=false;render()">뒤로</button>';
  if(c.m==='h')return `<h1>직접 연결 · 방 만들기</h1>${c.err?`<p class="m">${c.err}</p>`:c.busy?'<p class="m">코드 만드는 중…</p>':`<p class="m">① 아래 코드를 복사해 친구에게 보내세요</p><textarea id="out" readonly>${c.out}</textarea>${cp}<p class="m">② 친구가 돌려준 응답 코드를 붙여넣고 연결을 누르세요</p><textarea id="ans"></textarea><button onclick="dhc()">연결</button>`}${bk}`;
  return `<h1>직접 연결 · 참가</h1><p class="m">① 방장이 보낸 코드를 붙여넣으세요</p><textarea id="off"></textarea><button onclick="dgo()">응답 코드 만들기</button>${c.out?`<p class="m">② 아래 응답 코드를 방장에게 보내세요. 방장이 연결하면 자동으로 시작돼요.</p><textarea id="out" readonly>${c.out}</textarea>${cp}`:''}${bk}`}
/* ---------- 배경음악 (Web Audio로 만든 추리 분위기 루프) ---------- */
const BGM=(()=>{
  let ctx=null,mg=null,tm=null,step=0,next=0,playing=false,want=true;
  try{want=localStorage.getItem('dv_bgm')!=='0'}catch(_){}
  const ic=()=>{const b=document.getElementById('bgm');if(b)b.textContent=want?'🔊':'🔇'};
  const N=m=>440*Math.pow(2,(m-69)/12),sp=60/84/2,ROOT=[45,53,48,52],PAD=[[57,60,64],[53,57,60],[55,60,64],[52,56,59]],MEL={1:{2:76,5:72},3:{2:79,5:76}};
  function tone(f,t,d,type,v,fc,at){at=at||.02;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    if(fc){const bf=ctx.createBiquadFilter();bf.type='lowpass';bf.frequency.value=fc;o.connect(bf);bf.connect(g)}else o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
  function pump(){while(next<ctx.currentTime+.4){const bar=Math.floor(step/8)%4,i=step%8;
    if(i===0||i===4)tone(N(ROOT[bar]),next,1.1,'triangle',.3,500,.08);
    if(i%2===0)tone(1500,next,.04,'sine',.04);
    if(i===0)PAD[bar].forEach(m=>tone(N(m),next,sp*8,'triangle',.08,null,.9));
    const m=MEL[bar]&&MEL[bar][i];if(m)tone(N(m),next,.9,'sine',.12,null,.05);
    next+=sp;step++}}
  function build(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();mg=ctx.createGain();mg.gain.value=0;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
    const dl=ctx.createDelay();dl.delayTime.value=.45;const fb=ctx.createGain();fb.gain.value=.28;
    mg.connect(lp);lp.connect(ctx.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ctx.destination);return true}
  function start(){if(!ctx&&!build())return;ctx.resume();next=ctx.currentTime+.15;clearInterval(tm);tm=setInterval(pump,100);mg.gain.cancelScheduledValues(ctx.currentTime);mg.gain.setTargetAtTime(.13,ctx.currentTime,.4);playing=true}
  function stop(){if(!ctx)return;mg.gain.setTargetAtTime(0,ctx.currentTime,.15);playing=false;setTimeout(()=>{if(!playing){clearInterval(tm);ctx.suspend()}},700)}
  let fx=null;
  const out=()=>{if(!fx){fx=ctx.createGain();const cp=ctx.createDynamicsCompressor();cp.threshold.value=-28;cp.knee.value=20;cp.ratio.value=12;cp.attack.value=.003;cp.release.value=.2;const mv=ctx.createGain();mv.gain.value=.5;fx.connect(cp);cp.connect(mv);mv.connect(ctx.destination)}return fx};
  function nz(t,d,v,f,q){const len=Math.max(1,Math.floor(ctx.sampleRate*d)),buf=ctx.createBuffer(1,len,ctx.sampleRate),k=buf.getChannelData(0);for(let i=0;i<len;i++)k[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=ctx.createBufferSource();s.buffer=buf;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q||1;const g=ctx.createGain();g.gain.value=v;s.connect(bp);bp.connect(g);g.connect(out());s.start(t)}
  function th(t,v,f0,f1,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d*.8);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out());o.start(t);o.stop(t+d+.02)}
  function tap(){if(!want)return;if(!ctx&&!build())return;ctx.resume();const t=ctx.currentTime+.01;th(t,.12,170,110,.09);nz(t,.03,.05,1400,.8)}
  function grain(t,dur,d0,d1,v,att,f){const sr=ctx.sampleRate,len=Math.floor(sr*dur),buf=ctx.createBuffer(1,len,sr),k=buf.getChannelData(0);
    for(let i=0;i<len;i++){const p=i/len,dn=(d0+(d1-d0)*p)/sr,env=Math.min(1,p*dur/att)*(p>.85?(1-p)/.15:1);
      k[i]=(Math.random()<dn?(Math.random()*2-1)*(.4+Math.random()*.6):(i?k[i-1]*.55:0))*env+(Math.random()*2-1)*env*.05}
    const s=ctx.createBufferSource();s.buffer=buf;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=.5;const g=ctx.createGain();g.gain.value=v;
    s.connect(hp);hp.connect(bp);bp.connect(g);g.connect(out());s.start(t)}
  function pour(n){if(!want||!ctx)return;ctx.resume();const b=ctx.currentTime+.05,T=(2000+n*45+1100)/1000,a=Math.max(.5,.2+n*.045),c=1.85+a;
    grain(b+.4,.55,450,450,.22,.05,3500);
    grain(b+1.1,.9,200,900,.12,.45,3500);
    grain(b+1.9,a,2400,2200,.5,.25,4200);
    grain(b+c,T-c,2200,250,.45,.1,4200);
    grain(b+2,T-2,1800,300,.3,.3,5500)}
  function cut(){if(!ctx||!fx)return;const o=fx;fx=null;try{o.gain.setTargetAtTime(0,ctx.currentTime,.03)}catch(_){}setTimeout(()=>{try{o.disconnect()}catch(_){}},200)}
  const isBtn=e=>e.target.closest&&e.target.closest('#bgm');
  const first=e=>{if(isBtn(e))return;if(want&&!playing)start()};
  document.addEventListener('pointerup',first);document.addEventListener('click',first);
  document.addEventListener('click',e=>{if(!isBtn(e))return;want=!want;try{localStorage.setItem('dv_bgm',want?'1':'0')}catch(_){}want?start():stop();ic()});
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(playing)ctx.resume()});
  function ding(){if(!want)return;if(!ctx&&!build())return;ctx.resume();const t=ctx.currentTime+.02;[[659.25,0],[880,.12]].forEach(([f,o])=>{const os=ctx.createOscillator(),g=ctx.createGain();os.type='sine';os.frequency.value=f;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.22,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.7);os.connect(g);g.connect(out());os.start(t+o);os.stop(t+o+.75)})}
  ic();return{tap,pour,cut,ding}
})();
render();
